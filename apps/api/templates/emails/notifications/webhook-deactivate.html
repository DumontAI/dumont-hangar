{% extends "emails/base_dumont.html" %}

{% block title %}A Hangar webhook was disabled{% endblock %}

{% block heading %}
<h1 style="margin:0 0 16px;font-size:20px;line-height:1.35;color:#1B2433;">A webhook was disabled</h1>
{% endblock %}

{% block content %}
<p style="margin:0 0 24px;font-size:15px;line-height:1.65;color:#374151;">
  Hangar turned off one of your webhooks after repeated failures: {{message}}
</p>
<p style="margin:0;">
  <a href="{{webhook_url}}" style="display:inline-block;background-color:#C026D3;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:12px 24px;border-radius:8px;">Check the webhook</a>
</p>
{% endblock %}
